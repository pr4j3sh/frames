name: Node.js Package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # Required for npm OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g npm@11 # npm >= 11.5.0 required for OIDC trusted publishing
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm publish --access public --provenance
